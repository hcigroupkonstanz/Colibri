# colibri-server with TLS turned on, for the PlayMode TLS tests (Assets/Tests/TlsTests.cs).
# run-tests.mjs starts it next to the plain test server. The certificate is for tests only:
# see README.md.
name: colibri-unity-tls-test

services:
  colibri-tls:
    build: ../../colibri-server
    environment:
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem
    volumes:
      - ./cert.pem:/certs/cert.pem:ro
      - ./key.pem:/certs/key.pem:ro
    ports:
      - "${COLIBRI_E2E_TLS_PORT:-9111}:9211" # web interface, https
      - "${COLIBRI_E2E_TLS_TCP_PORT:-9112}:9212" # tcp (unity), TLS
