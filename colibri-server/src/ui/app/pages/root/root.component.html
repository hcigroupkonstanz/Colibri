<header class="appbar no-select">
  <a class="brand" routerLink="/log">
    <img src="assets/logo_small.webp" alt="">
    <span>Colibri</span>
  </a>

  <nav class="tabs" aria-label="Pages">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ tab.label }}</a>
    }
  </nav>

  <span class="status {{ state() }}" role="status" [title]="statusTitle()">
    <span class="dot" aria-hidden="true"></span>
    <span class="label">{{ statusLabel() }}</span>
  </span>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
