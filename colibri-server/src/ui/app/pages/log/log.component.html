<app-log-toolbar [following]="following()" (followChange)="$event ? follow() : pause()" [matches]="search() ? matches().length : null"
  [nav]="nav()" (navigate)="navigate($event)" (download)="download($event)"></app-log-toolbar>

<app-offline-banner></app-offline-banner>

<div class="viewport">
  <div #scroller class="scroller" [class.paused]="!following()" role="log" aria-label="Log lines" tabindex="-1"
    (scroll)="onScroll()" (pointerdown)="onPointerDown($event)" (click)="onClick($event)">
    @if (hidden() > 0) {
      <button type="button" class="older" (click)="showOlder()">
        Show {{ olderStep() }} older lines <span class="muted">({{ hidden() }} not shown)</span>
      </button>
    }

    @for (row of rows(); track row.id) {
      @if (dayStarts().has(row.id)) {
        <div class="day">{{ row.created | date:'EEEE, yyyy-MM-dd' }}</div>
      }
      <app-log-message [attr.data-id]="row.id" [log]="row" [search]="search()" [current]="row.id === current()"></app-log-message>
    }

    @if (empty(); as empty) {
      <div class="empty">
        <p>{{ empty.text }}</p>
        @if (empty.action) {
          <button type="button" (click)="empty.action.run()">{{ empty.action.label }}</button>
        }
      </div>
    }
  </div>

  @if (!following()) {
    <div class="jump-bar">
      @if (current() !== null) {
        <button type="button" class="jump-step" aria-label="Previous error or warning" title="Previous error or warning (p)" (click)="navigate('previous')">
          <i class="pi pi-chevron-up" aria-hidden="true"></i>
        </button>
      }
      <button type="button" class="jump" (click)="follow()" [attr.aria-label]="'Jump to the latest lines' + (newLines() > 0 ? ', ' + newLines() + ' new' : '')">
        <i class="pi pi-arrow-down" aria-hidden="true"></i>
        @if (newLines() > 0) {
          {{ newLines() }} new {{ newLines() === 1 ? 'line' : 'lines' }}
        } @else {
          Jump to latest
        }
      </button>
      @if (current() !== null) {
        <button type="button" class="jump-step" aria-label="Next error or warning" title="Next error or warning (n)" (click)="navigate('next')">
          <i class="pi pi-chevron-down" aria-hidden="true"></i>
        </button>
      }
    </div>
  }
</div>
